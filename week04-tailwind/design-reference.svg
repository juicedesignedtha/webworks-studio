<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1900" role="img" aria-labelledby="title desc">
<title id="title">Hill and Hollow Coffee visual reference</title>
<desc id="desc">A full-page design reference showing a warm coffee landing page with a dark header, tan hero, three product cards, a split story section, three value cards, a dark contact section, and footer.</desc>

<rect width="1400" height="1900" fill="#faf7f2"/>

<!-- Header -->
<rect x="0" y="0" width="1400" height="110" fill="#2f241f"/>
<text x="100" y="68" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#fffaf4">HILL &amp; HOLLOW COFFEE</text>
<text x="985" y="66" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#fffaf4">Coffee</text>
<text x="1080" y="66" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#fffaf4">Our Story</text>
<text x="1210" y="66" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#fffaf4">Visit</text>

<!-- Hero -->
<rect x="0" y="110" width="1400" height="520" fill="#eadcca"/>
<text x="100" y="205" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#8b5e3c">SMALL-BATCH ROASTED IN THE TEXAS HILL COUNTRY</text>
<text x="100" y="285" font-family="Arial,Helvetica,sans-serif" font-size="60" font-weight="700" fill="#2f241f">Good coffee.</text>
<text x="100" y="355" font-family="Arial,Helvetica,sans-serif" font-size="60" font-weight="700" fill="#2f241f">No complicated personality required.</text>
<text x="100" y="420" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#63564f">Approachable, small-batch coffee without the tasting-wheel vocabulary.</text>
<rect x="100" y="475" width="250" height="58" rx="10" fill="#6d4a38"/>
<text x="225" y="513" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ffffff">SHOP THE ROAST LINEUP</text>
<rect x="370" y="475" width="210" height="58" rx="10" fill="none" stroke="#6d4a38" stroke-width="3"/>
<text x="475" y="513" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#6d4a38">MEET THE ROASTERY</text>
<rect x="880" y="170" width="380" height="380" rx="28" fill="#d4b69a"/>
<rect x="970" y="245" width="180" height="230" fill="#6d4a38"/>
<rect x="1005" y="290" width="110" height="90" fill="#f5eadc"/>
<circle cx="1190" cy="430" r="60" fill="#b98458"/>

<!-- Product section -->
<text x="100" y="715" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#8b5e3c">ROAST LINEUP</text>
<text x="100" y="775" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#2f241f">Three coffees. Zero existential crisis.</text>

<g>
<rect x="100" y="830" width="360" height="300" rx="18" fill="#ffffff" stroke="#ded6cc" stroke-width="3"/>
<text x="135" y="885" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#8b5e3c">MEDIUM ROAST</text>
<text x="135" y="935" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#2f241f">Front Porch</text>
<text x="135" y="980" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#63564f">Milk chocolate · almond · brown sugar</text>
<rect x="135" y="1045" width="170" height="45" rx="8" fill="#f0e4d5"/>
</g>
<g>
<rect x="520" y="830" width="360" height="300" rx="18" fill="#ffffff" stroke="#ded6cc" stroke-width="3"/>
<text x="555" y="885" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#8b5e3c">LIGHT ROAST</text>
<text x="555" y="935" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#2f241f">Daybreak</text>
<text x="555" y="980" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#63564f">Citrus · honey · clean finish</text>
<rect x="555" y="1045" width="170" height="45" rx="8" fill="#f0e4d5"/>
</g>
<g>
<rect x="940" y="830" width="360" height="300" rx="18" fill="#ffffff" stroke="#ded6cc" stroke-width="3"/>
<text x="975" y="885" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#8b5e3c">DARK ROAST</text>
<text x="975" y="935" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#2f241f">Last Light</text>
<text x="975" y="980" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#63564f">Cocoa · caramelized sugar · smoke</text>
<rect x="975" y="1045" width="170" height="45" rx="8" fill="#f0e4d5"/>
</g>

<!-- Story -->
<rect x="0" y="1200" width="1400" height="350" fill="#f0e5d7"/>
<rect x="100" y="1260" width="470" height="230" rx="20" fill="#b99472"/>
<text x="660" y="1285" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#8b5e3c">OUR STORY</text>
<text x="660" y="1340" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" fill="#2f241f">Roasted for normal mornings.</text>
<text x="660" y="1395" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#63564f">Excellent coffee can still be approachable.</text>

<!-- Value cards -->
<rect x="100" y="1600" width="360" height="150" rx="18" fill="#ffffff" stroke="#ded6cc" stroke-width="3"/>
<rect x="520" y="1600" width="360" height="150" rx="18" fill="#ffffff" stroke="#ded6cc" stroke-width="3"/>
<rect x="940" y="1600" width="360" height="150" rx="18" fill="#ffffff" stroke="#ded6cc" stroke-width="3"/>
<text x="135" y="1665" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#2f241f">Fresh</text>
<text x="555" y="1665" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#2f241f">Simple</text>
<text x="975" y="1665" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#2f241f">Local</text>

<!-- Contact -->
<rect x="0" y="1800" width="1400" height="100" fill="#2f241f"/>
<text x="100" y="1860" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#fffaf4">COME SMELL WHAT WE'RE ROASTING.</text>
<text x="930" y="1860" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#fffaf4">Boerne, Texas · Tue–Sat 8–4</text>
</svg>
